[project]
name = "ch6-multimodal-perception"
version = "0.1.0"
description = "Chapter 6: Multimodal Perception companion repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.2.7",
    "sentence-transformers>=3.0.0",
    "google-genai>=0.1.0",
    "ollama>=0.2.0",
    "faster-whisper>=1.0.0",
    "docling>=2.0.0",
    "gliner>=0.1.0",
    "pillow>=10.3.0",
    "reportlab>=4.1.0",
    "pandas>=2.2.0",
    "faker>=25.0.0",
    "edge-tts>=6.1.10",
    "aiosqlite>=0.20.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",
    "gradio>=5.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ch6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
